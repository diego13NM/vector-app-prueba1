      --cyan-glow: rgba(0, 243, 255, 0.25);
      --fuchsia-neon: #d946ef;
      --fuchsia-glow: rgba(217, 70, 239, 0.25);
      --red-alert: #ef4444;
      --green-status: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(0, 243, 255, 0.3);
      --font-mono: 'Fira Code', monospace;
      --font-sans: 'Inter', sans-serif;

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;

    header {
      background-color: rgba(10, 14, 23, 0.95);
      border-bottom: 1px solid var(--cyan-neon);
      box-shadow: 0 0 15px var(--cyan-glow);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
    }

    .brand-logo {
      font-family: var(--font-mono);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--cyan-neon);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px var(--cyan-neon);
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--fuchsia-neon);
      font-family: var(--font-mono);
      border-left: 2px solid var(--fuchsia-neon);
      padding-left: 0.5rem;
    }

    nav {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 0.5rem 0.8rem;
      border: 1px solid transparent;
      border-radius: 4px;
      transition: all 0.2s ease-in-out;
      text-transform: uppercase;
    }

    nav a:hover, nav a.active {
      color: var(--cyan-neon);
      border-color: var(--cyan-neon);
      background-color: rgba(0, 243, 255, 0.08);
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .section-header {
      margin-bottom: 2rem;
      border-left: 4px solid var(--cyan-neon);
      padding-left: 1rem;
    }

    .section-header h1 {
      font-family: var(--font-mono);
      font-size: 1.8rem;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .section-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--green-status);
      color: var(--green-status);
      margin-top: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--green-status);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green-status);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .controls-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 280px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--cyan-neon);
      color: var(--cyan-neon);
      font-family: var(--font-mono);
      padding: 0.75rem 1rem;
      border-radius: 4px;
      outline: none;
    }

    .search-input::placeholder {
      color: rgba(0, 243, 255, 0.5);
    }

    .select-input {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--cyan-neon);
      color: var(--cyan-neon);
      font-family: var(--font-mono);
      padding: 0.75rem 1rem;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: var(--cyan-neon);
      box-shadow: 0 0 10px var(--cyan-neon);
    }

    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--cyan-neon);
      transform: translateY(-3px);
      box-shadow: 0 5px 20px rgba(0, 243, 255, 0.15);
    }

    .card-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 2px;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      background: rgba(217, 70, 239, 0.15);
      color: var(--fuchsia-neon);
      border: 1px solid var(--fuchsia-neon);
      width: fit-content;
    }

    .card h3 {
      font-family: var(--font-mono);
      font-size: 1.15rem;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .card-entity {
      color: var(--cyan-neon);
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    .meta-box {
      background: rgba(10, 14, 23, 0.8);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      padding: 0.75rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      margin-bottom: 1.25rem;
      color: #cbd5e1;
    }

    .meta-box div { margin-bottom: 0.35rem; }
    .meta-box strong { color: var(--cyan-neon); }

    .links-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.5rem;
    }

    .link-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      padding: 0.25rem 0.5rem;
      background: rgba(0, 243, 255, 0.1);
      color: var(--cyan-neon);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 3px;
      text-decoration: none;
      word-break: break-all;
      transition: all 0.2s;
    }

    .link-badge:hover {
      background: var(--cyan-neon);
      color: var(--bg-dark);
      box-shadow: 0 0 8px var(--cyan-neon);
    }

    .table-container {
      overflow-x: auto;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .custom-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      text-align: left;
    }

    .custom-table th {
      font-family: var(--font-mono);
      color: var(--cyan-neon);
      border-bottom: 1px solid var(--cyan-neon);
      padding: 0.85rem 0.6rem;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.5px;
    }

    .custom-table td {
      padding: 0.85rem 0.6rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      vertical-align: middle;

      width: 100%;
      text-align: center;
      background: transparent;
      color: var(--cyan-neon);
      border: 1px solid var(--cyan-neon);
      padding: 0.65rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;

    .btn:hover {

      color: var(--bg-dark);
      box-shadow: 0 0 15px var(--cyan-neon);

    .btn-fuchsia:hover {

      color: var(--bg-dark);
      box-shadow: 0 0 15px var(--fuchsia-neon);
    }

    .btn-group {
      display: flex;
      gap: 0.5rem;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 14, 23, 0.9);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-content {
      background: var(--bg-dark);
      border: 2px solid var(--cyan-neon);
      border-radius: 8px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      box-shadow: 0 0 30px var(--cyan-glow);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: transparent;
      border: 1px solid var(--red-alert);
      color: var(--red-alert);
      font-family: var(--font-mono);
      font-weight: bold;
      padding: 0.2rem 0.6rem;
      cursor: pointer;
    }

    footer {

      background: rgba(10, 14, 23, 0.95);
      padding: 1.5rem;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 3rem;
    }

    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

</head>

    function parseCSV(text) {
      const lines = [];
      let row = [];
      let col = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"') {
          if (inQuotes && next === '"') { col += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (c === ',' && !inQuotes) {
          row.push(col.trim());
          col = '';
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') { i++; }
          row.push(col.trim());
          if (row.some(field => field !== '')) lines.push(row);
          row = [];
          col = '';
        } else {
          col += c;
        }
      }
      if (col || row.length) {
        row.push(col.trim());
        if (row.some(field => field !== '')) lines.push(row);
      }

      if (lines.length < 2) return [];

      const headers = lines[0];
      return lines.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, idx) => {
          obj[h.trim()] = r[idx] ? r[idx].trim() : '';
        });
        return obj;
      });
    }

    async function fetchLiveData() {
      state.isLoading = true;
      state.loadError = false;
      
      const targetUrl = RAW_SHEET_URL + "&t=" + new Date().getTime();
      const endpoints = [
        targetUrl,
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl),
        "https://corsproxy.io/?" + encodeURIComponent(targetUrl)
      ];

      let csvText = null;

      for (const url of endpoints) {
        try {
          const response = await fetch(url);
          if (response.ok) {
            const text = await response.text();
            if (text && text.length > 20 && !text.includes("<!DOCTYPE html>")) {
              csvText = text;
              break;
            }
          }
        } catch (err) {
          console.warn("Reintentando conexión con endpoint alternativo:", url);
        }
      }

      if (csvText) {
        state.liveConvocatorias = parseCSV(csvText);
        state.loadError = false;
      } else {
        state.loadError = true;
      }

      state.isLoading = false;
      router();
    }

            <p>Aplicaciones interactivas creadas para dinamizar la autogestión de carrera y resolución de crisis.</p>
            <a href="#/herramientas" class="btn btn-fuchsia">Abrir Apps</a>
          </div>
        </div>
      `,

      '/rutaoportunidades': () => {
        const filtered = state.liveConvocatorias.filter(item => {
          const q = state.searchTerm.toLowerCase();
          return (
            (item['Título de la convocatoria'] || '').toLowerCase().includes(q) ||
            (item['Nombre de la entidad'] || '').toLowerCase().includes(q) ||
            (item['Programas académicos requeridos'] || '').toLowerCase().includes(q) ||
            (item['Ciudad'] || '').toLowerCase().includes(q)
          );
        });

        return `
          <div class="section-header fade-in">
            <h1>Ruta de Oportunidades (Prácticas y Pasantías)</h1>
            <p>Convocatorias oficiales sincronizadas en tiempo real desde el Google Sheet oficial.</p>
            <div class="status-badge">
              <span class="status-dot"></span> 
              ${state.isLoading ? 'CARGANDO REGISTROS EN VIVO...' : 'SINCRONIZADO EN TIEMPO REAL (' + state.liveConvocatorias.length + ' OFERTAS)'}
            </div>
          </div>

          <div class="controls-bar fade-in">
            <input 
              type="text" 
              class="search-input" 
              placeholder="Ingresa parámetro de búsqueda (carrera, empresa, ciudad, palabra clave)..."
              value="${state.searchTerm}"
              oninput="state.searchTerm = this.value; router();"
            />
          </div>

          ${state.isLoading ? '<p style="color:var(--cyan-neon); font-family:var(--font-mono);">Cargando datos desde Google Sheets...</p>' : ''}
          ${state.loadError ? '<p style="color:var(--red-alert); font-family:var(--font-mono);">Error al descargar los datos. Comprueba la publicación del archivo en la web.</p>' : ''}

          <div class="grid fade-in">
            ${filtered.length === 0 && !state.isLoading ? '<p style="color:var(--text-muted);">No se encontraron convocatorias que coincidan con el parámetro de búsqueda.</p>' : ''}
            
            ${filtered.map((c, idx) => `
              <div class="card">
                <div>
                  <span class="card-tag">${c['Modalidad'] || 'Convocatoria'}</span>
                  <h3>${c['Título de la convocatoria'] || c['Cargo'] || 'Sin Título'}</h3>
                  <div class="card-entity">Entidad: ${c['Nombre de la entidad'] || 'No registrada'}</div>
                  <p>${(c['Descripción'] || 'Sin descripción disponible.').substring(0, 110)}...</p>
                </div>
                
                <div>
                  <div class="meta-box">
                    <div><strong>Programa:</strong> ${c['Programas académicos requeridos'] || 'Todos'}</div>
                    <div><strong>Apoyo:</strong> ${c['Apoyo económico'] || 'No especificado'}</div>
                    <div><strong>Ciudad:</strong> ${c['Ciudad'] || 'No especificada'}</div>
                    <div><strong>Cierre:</strong> ${c['Fecha de cierre'] || 'Abierta'}</div>
                  </div>

                  <div class="btn-group">
                    <button class="btn" onclick="openModal(${idx})">Ver Detalle Completo</button>
                    ${c['Si desea ser presentado por la Universidad, postule su hoja de vida en el siguiente forms'] ? 
                      `<a href="${c['Si desea ser presentado por la Universidad, postule su hoja de vida en el siguiente forms']}" target="_blank" class="btn btn-fuchsia">Postular</a>` : ''
                    }
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      },

      '/becas': () => {
        const filtered = becasData.filter(b => {
          const q = state.becasSearchTerm.toLowerCase();
          const matchesSearch = (
            b.nombre.toLowerCase().includes(q) ||
            b.entidad.toLowerCase().includes(q) ||
            b.requisitos.toLowerCase().includes(q) ||
            b.nivel.toLowerCase().includes(q) ||
            b.cobertura.toLowerCase().includes(q)
          );
          const matchesType = state.becasTypeFilter === 'ALL' || b.tipo.includes(state.becasTypeFilter);
          return matchesSearch && matchesType;
        });

        return `
          <div class="section-header fade-in">
            <h1>Becas y Financiación de Posgrado</h1>
            <p>Opciones institucionales y externas para la financiación de estudios de posgrado e investigación.</p>
          </div>

          <div class="controls-bar fade-in">
            <input 
              type="text" 
              class="search-input" 
              placeholder="Buscar por nombre de beca, entidad, requisito o nivel..."
              value="${state.becasSearchTerm}"
              oninput="state.becasSearchTerm = this.value; router();"
            />
            <select class="select-input" onchange="state.becasTypeFilter = this.value; router();">
              <option value="ALL" ${state.becasTypeFilter === 'ALL' ? 'selected' : ''}>Todos los tipos</option>
              <option value="Interna UNAL" ${state.becasTypeFilter === 'Interna UNAL' ? 'selected' : ''}>Interna UNAL</option>
              <option value="Externa" ${state.becasTypeFilter === 'Externa' ? 'selected' : ''}>Externa</option>
            </select>
          </div>

          <div class="table-container fade-in">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>Nombre de la Beca</th>
                  <th>Tipo</th>
                  <th>Nivel Aplicable</th>
                  <th>Cobertura / Beneficio</th>
                  <th>Entidad Administradora</th>
                  <th>Requisitos Principales</th>
                  <th style="text-align:center;">Enlace</th>
                </tr>
              </thead>
              <tbody>
                ${filtered.length === 0 ? '<tr><td colspan="7" style="text-align:center; color:var(--text-muted); padding:2rem;">No se encontraron becas que coincidan con los criterios de búsqueda.</td></tr>' : ''}
                ${filtered.map(b => `
                  <tr>
                    <td style="font-weight:600; color:#fff;">${b.nombre}</td>
                    <td><span class="card-tag" style="margin-bottom:0; font-size:0.65rem;">${b.tipo}</span></td>
                    <td style="font-family:var(--font-mono); font-size:0.8rem; color:var(--cyan-neon);">${b.nivel}</td>
                    <td>${b.cobertura}</td>
                    <td>${b.entidad}</td>
                    <td style="font-size:0.8rem; color:var(--text-muted);">${b.requisitos}</td>
                    <td style="text-align:center;">
                      <a href="${b.link}" target="_blank" class="btn btn-fuchsia" style="padding:0.35rem 0.6rem; font-size:0.75rem; display:inline-block; width:auto;">Ver ↗</a>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      },

      '/egresadosempresarios': () => {
        const filtered = egresadosEmpresariosData.filter(e => {
          const q = state.empresariosSearchTerm.toLowerCase();
          const matchesSearch = (
            e.nombre.toLowerCase().includes(q) ||
            e.sector.toLowerCase().includes(q) ||
            e.direccion.toLowerCase().includes(q) ||
            e.telefono.toLowerCase().includes(q)
          );
          const matchesSector = state.empresariosSectorFilter === 'ALL' || e.sector.toLowerCase().includes(state.empresariosSectorFilter.toLowerCase());
          return matchesSearch && matchesSector;
        });

        return `
          <div class="section-header fade-in">
            <h1>Egresados Empresarios (Red UNAL)</h1>
            <p>Directorio de empresas y organizaciones fundadas por egresados de la Universidad Nacional de Colombia.</p>
          </div>

          <div class="controls-bar fade-in">
            <input 
              type="text" 
              class="search-input" 
              placeholder="Buscar por empresa, sector, dirección o teléfono..."
              value="${state.empresariosSearchTerm}"
              oninput="state.empresariosSearchTerm = this.value; router();"
            />
            <select class="select-input" onchange="state.empresariosSectorFilter = this.value; router();">
              <option value="ALL" ${state.empresariosSectorFilter === 'ALL' ? 'selected' : ''}>Todos los sectores</option>
              <option value="Servicios" ${state.empresariosSectorFilter === 'Servicios' ? 'selected' : ''}>Servicios</option>
              <option value="Tecnología" ${state.empresariosSectorFilter === 'Tecnología' ? 'selected' : ''}>Tecnología e IA</option>
              <option value="Alimentos" ${state.empresariosSectorFilter === 'Alimentos' ? 'selected' : ''}>Alimentos y Agro</option>
              <option value="Consultoría" ${state.empresariosSectorFilter === 'Consultoría' ? 'selected' : ''}>Consultoría</option>
              <option value="Audiovisual" ${state.empresariosSectorFilter === 'Audiovisual' ? 'selected' : ''}>Audiovisual / Educación</option>
            </select>
          </div>

          <div class="grid fade-in">
            ${filtered.length === 0 ? '<p style="color:var(--text-muted);">No se encontraron empresas de egresados que coincidan con la búsqueda.</p>' : ''}
            
            ${filtered.map(e => `
              <div class="card">
                <div>
                  <span class="card-tag">Egresado UNAL</span>
                  <h3>${e.nombre}</h3>
                  <div class="card-entity">${e.sector}</div>
                </div>
                
                <div>
                  <div class="meta-box">
                    <div><strong>Dirección:</strong> ${e.direccion}</div>
                    <div><strong>Teléfono:</strong> ${e.telefono}</div>
                  </div>

                  <div style="margin-top:0.5rem;">
                    <span style="font-family:var(--font-mono); font-size:0.75rem; color:var(--cyan-neon); display:block; margin-bottom:0.3rem;">Enlaces y Redes:</span>
                    <div class="links-grid">
                      ${e.links.map(l => `<a href="${l.url}" target="_blank" rel="noopener noreferrer" class="link-badge">${l.name} ↗</a>`).join('')}
                    </div>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      },

      '/radaraliados': () => {
        const filtered = radarAliadosData.filter(r => {
          const q = state.radarSearchTerm.toLowerCase();
          return (
            r.empresa.toLowerCase().includes(q) ||
            r.perfiles.toLowerCase().includes(q) ||
            r.tecnicas.toLowerCase().includes(q) ||
            r.herramientas.toLowerCase().includes(q) ||
            r.blandas.toLowerCase().includes(q) ||
            r.canal.toLowerCase().includes(q)
          );
        });

        return `
          <div class="section-header fade-in">
            <h1>Radar de Aliados (Preferencia por Talento UNAL)</h1>
            <p>Empresas aliadas con vacantes y requerimientos clave para graduados y estudiantes de la Universidad Nacional.</p>
          </div>

          <div class="controls-bar fade-in">
            <input 
              type="text" 
              class="search-input" 
              placeholder="Buscar por empresa, carrera, habilidad técnica, herramienta o tipo de canal..."
              value="${state.radarSearchTerm}"
              oninput="state.radarSearchTerm = this.value; router();"
            />
          </div>

          <div class="grid fade-in">
            ${filtered.length === 0 ? '<p style="color:var(--text-muted);">No se encontraron aliados que coincidan con el criterio de búsqueda.</p>' : ''}
            
            ${filtered.map(r => `
              <div class="card">
                <div>
                  <span class="card-tag">${r.canal}</span>
                  <h3>${r.empresa}</h3>
                  <div class="card-entity">Perfiles: ${r.perfiles}</div>
                </div>
                
                <div>
                  <div class="meta-box">
                    <div><strong>Habilidades Técnicas:</strong> ${r.tecnicas}</div>
                    <div><strong>Herramientas / Software:</strong> ${r.herramientas}</div>
                    <div><strong>Habilidades Blandas:</strong> ${r.blandas}</div>
                  </div>

                  <a href="${r.url}" target="_blank" rel="noopener noreferrer" class="btn btn-fuchsia">
                    ${r.enlace} ↗
                  </a>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      },

      '/laboratorio': () => `
        <div class="section-header fade-in">
          <h1>Laboratorio de Experiencias</h1>
          <p>Talleres formativos e intervenciones estratégicas realizadas por el equipo VECTOR.</p>
        </div>
        <div class="grid fade-in">
          <div class="card">
            <span class="card-tag">Metodología STAR</span>
            <h3>Taller Código de Impacto</h3>
            <p>Formulación estratégica de logros de hoja de vida, estructuración de impactos y preparación técnica de entrevistas.</p>
          </div>
          <div class="card">
            <span class="card-tag">Autonomía Vocacional</span>
            <h3>La Ruleta de Dilemas</h3>
            <p>Intervención dinámica en espacio público para el análisis de toma de decisiones y proyección profesional.</p>
          </div>
          <div class="card">
            <span class="card-tag">Simulación Real</span>
            <h3>Simulador de Selección Relámpago</h3>
            <p>Sesiones relámpago con evaluadores reales para retroalimentación en tiempo real del perfil del aspirante.</p>
          </div>
        </div>
      `,

      '/herramientas': () => `
        <div class="section-header fade-in">
          <h1>Caja de Herramientas (Apps)</h1>
          <p>Software y aplicativos diseñados para acompañar la gestión emocional y técnica.</p>
        </div>
        <div class="grid fade-in">
          <div class="card">
            <span class="card-tag">Gamificación</span>
            <h3>Escape Room: Código de Impacto</h3>
            <p>Aplicación interactiva de resolución de retos para la identificación de logros laborales clave.</p>
            <button onclick="openEscapeRoomModal()" class="btn">Lanzar App (Integrada)</button>
            <a href="escaperoom VECTOR.html" target="_blank" class="btn btn-fuchsia" style="margin-top:0.5rem;">Pantalla Completa ↗</a>
          </div>
          <div class="card">
            <span class="card-tag">Gestión Emocional</span>
            <h3>La Caja de Crisis Interactiva</h3>
            <p>Módulo interactivo de tarjetas aleatorias para contención y autorregulación en momentos de toma de decisiones.</p>
            <button onclick="openCrisisModal()" class="btn">Lanzar App (Integrada)</button>
            <a href="la_caja_de_crisis.html" target="_blank" class="btn btn-fuchsia" style="margin-top:0.5rem;">Pantalla Completa ↗</a>
          </div>
        </div>
      `
    };

    function openModal(index) {
      const item = state.liveConvocatorias[index];
      if (!item) return;

      const modalHtml = `
        <div class="modal-overlay fade-in" onclick="closeModal(event)">
          <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">X</button>
            <h2 style="color:var(--cyan-neon); font-family:var(--font-mono); margin-bottom:1rem;">
              ${item['Título de la convocatoria'] || item['Cargo'] || 'Detalle de Convocatoria'}
            </h2>
            
            <div style="font-family:var(--font-mono); font-size:0.85rem; line-height:1.6; color:#e2e8f0;">
              <p><strong>N° Convocatoria:</strong> ${item['Numero de convocatoria'] || 'N/A'}</p>
              <p><strong>Entidad:</strong> ${item['Nombre de la entidad'] || 'N/A'} (${item['Sector de la entidad'] || 'General'})</p>
              <p><strong>Cargo:</strong> ${item['Cargo'] || 'N/A'} | <strong>Área:</strong> ${item['Área'] || 'N/A'}</p>
              <p><strong>Contacto:</strong> ${item['Correo electrónico'] || 'N/A'}</p>
              <p><strong>Programas Requeridos:</strong> ${item['Programas académicos requeridos'] || 'Todos'}</p>
              <p><strong>Modalidad:</strong> ${item['Modalidad'] || 'N/A'} | <strong>Horario:</strong> ${item['Horario'] || 'N/A'} (${item['Horario flexible'] === 'Sí' ? 'Flexible' : 'Fijo'})</p>
              <p><strong>Apoyo Económico:</strong> ${item['Apoyo económico'] || 'N/A'}</p>
              <p><strong>Tipo de Contrato:</strong> ${item['Tipo de contrato'] || 'N/A'}</p>
              <p><strong>Ubicación:</strong> ${item['Ciudad'] || 'N/A'} | <strong>Vacantes:</strong> ${item['Vacantes'] || 'N/A'}</p>
              <p><strong>Fechas:</strong> Cierre: ${item['Fecha de cierre'] || 'Abierta'} | Inicio: ${item['Fecha de inicio de activities'] || item['Fecha de inicio de actividades'] || 'N/A'}</p>
              
              <hr style="border-color:var(--border-color); margin:1rem 0;">
              
              <p><strong>Descripción del Puesto:</strong></p>
              <p style="color:var(--text-muted); margin-bottom:1rem;">${item['Descripción'] || 'Sin descripción.'}</p>

              <p><strong>Perfil del Aspirante:</strong></p>
              <p style="color:var(--text-muted); margin-bottom:1.5rem;">${item['Perfil del aspirante'] || 'Sin perfil detallado.'}</p>

              ${item['Si desea ser presentado por la Universidad, postule su hoja de vida en el siguiente forms'] ? `
                <a href="${item['Si desea ser presentado por la Universidad, postule su hoja de vida en el siguiente forms']}" target="_blank" class="btn btn-fuchsia">
                  Postular Hoja de Vida (Google Forms)
                </a>
              ` : ''}
            </div>
          </div>
        </div>
      `;
      document.getElementById('modal-root').innerHTML = modalHtml;
    }

    function closeModal() {
      document.getElementById('modal-root').innerHTML = '';
    }

    function openEscapeRoomModal() {
      document.getElementById('escapeRoomIframe').src = 'escaperoom VECTOR.html';
      document.getElementById('escapeRoomModal').style.display = 'flex';
    }

    function closeEscapeRoomModal() {
      document.getElementById('escapeRoomIframe').src = '';
      document.getElementById('escapeRoomModal').style.display = 'none';
    }

    function openCrisisModal() {
      document.getElementById('crisisModal').style.display = 'flex';
      document.body.style.overflow = 'hidden'; 
    }

    function closeCrisisModal() {
      document.getElementById('crisisModal').style.display = 'none';
      document.body.style.overflow = 'auto'; 
    }

    function router() {
      const path = location.hash.slice(1) || '/';
      const renderView = views[path] || views['/'];
      
      document.getElementById('app').innerHTML = renderView();

      document.querySelectorAll('#nav-menu a').forEach(link => {
        link.classList.toggle('active', link.getAttribute('href') === `#${path}`);
      });
    }

    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', () => {
      fetchLiveData();
    });
  </script>
</body>
</html>
