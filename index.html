<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniVector PRO | Campus Navegantes</title>
  
  <!-- Tipografías: Fira Code (Consola) e Inter (Lectura) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Paleta Neón (Los 3 Pilares) */
      --cyan-neon: #00f3ff;
      --magenta-neon: #d946ef;
      --red-alert: #ef4444;
      
      /* Fondos y Superficies */
      --bg-dark: #050505; /* Negro profundo */
      --bg-panel: rgba(15, 23, 42, 0.75); /* #0f172a con opacidad */
      --panel-border: rgba(0, 243, 255, 0.2);
      
      /* Textos */
      --text-main: #e2e8f0; /* Gris claro para legibilidad */
      --text-muted: #94a3b8;
      
      /* Tipografías */
      --font-mono: 'Fira Code', monospace;
      --font-sans: 'Inter', sans-serif;
      
      --transition: all 0.3s ease-in-out;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      /* Patrón de cuadrícula sutil (Grid) */
      background-image: 
        linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      background-attachment: fixed;
      
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .mono-text, .nav-links a {
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    h1 {
      color: var(--cyan-neon);
      font-size: 2rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
    }
    
    h1::before { content: ">_ "; color: var(--magenta-neon); }

    header {
      background: rgba(5, 5, 5, 0.9);
      border-bottom: 1px solid var(--cyan-neon);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.15);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(5px);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--cyan-neon);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
    }

    nav {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      padding: 0.5rem 0.75rem;
      font-size: 0.85rem;
      border: 1px solid transparent;
      transition: var(--transition);
    }

    nav a:hover, nav a.active {
      color: var(--cyan-neon);
      border-bottom: 1px solid var(--cyan-neon);
      text-shadow: 0 0 5px rgba(0, 243, 255, 0.5);
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 2rem;
      margin-top: 2rem;
    }

    .card {
      background: var(--bg-panel);
      border: 1px solid var(--panel-border);
      padding: 1.5rem;
      position: relative;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px;
      width: 10px; height: 10px;
      border-top: 2px solid var(--cyan-neon);
      border-left: 2px solid var(--cyan-neon);
    }

    .card::after {
      content: '';
      position: absolute;
      bottom: -1px; right: -1px;
      width: 10px; height: 10px;
      border-bottom: 2px solid var(--cyan-neon);
      border-right: 2px solid var(--cyan-neon);
    }

    .card:hover {
      border-color: var(--cyan-neon);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.1);
      transform: translateY(-2px);
    }

    .card h3 {
      color: var(--cyan-neon);
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
    }

    .card p {
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
      color: var(--text-muted);
    }

    .badge {
      font-family: var(--font-mono);
      display: inline-block;
      padding: 0.25rem 0.5rem;
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 1rem;
      border: 1px solid;
      background: rgba(0,0,0,0.5);
    }
    
    .badge.cyan { border-color: var(--cyan-neon); color: var(--cyan-neon); }
    .badge.magenta { border-color: var(--magenta-neon); color: var(--magenta-neon); }
    .badge.red { border-color: var(--red-alert); color: var(--red-alert); }

    .btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      background: rgba(0, 243, 255, 0.05);
      color: var(--cyan-neon);
      padding: 0.75rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid var(--cyan-neon);
      cursor: pointer;
      transition: var(--transition);
      letter-spacing: 1px;
    }

    .btn:hover {
      background: var(--cyan-neon);
      color: var(--bg-dark);
      box-shadow: 0 0 15px var(--cyan-neon);
    }

    .btn.secondary {
      background: rgba(217, 70, 239, 0.05);
      color: var(--magenta-neon);
      border-color: var(--magenta-neon);
    }

    .btn.secondary:hover {
      background: var(--magenta-neon);
      color: var(--bg-dark);
      box-shadow: 0 0 15px var(--magenta-neon);
    }

    .search-container {
      margin-bottom: 2rem;
      display: flex;
      gap: 1rem;
      position: relative;
    }

    .search-container::before {
      content: 'SYS.SEARCH::';
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-mono);
      color: var(--magenta-neon);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .search-input {
      flex: 1;
      padding: 0.75rem 1rem 0.75rem 8rem;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--panel-border);
      color: var(--cyan-neon);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
    }

    .search-input:focus {
      border-color: var(--cyan-neon);
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }
    
    .search-input::placeholder {
      color: rgba(0, 243, 255, 0.3);
    }

    .metrics-container {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }
    
    .metric-box {
      flex: 1;
      min-width: 200px;
      background: var(--bg-panel);
      padding: 1.5rem;
      border: 1px solid var(--panel-border);
      border-left: 3px solid var(--magenta-neon);
    }
    
    .metric-box h4 { 
      color: var(--text-muted); 
      font-size: 0.8rem;
      margin-bottom: 0.5rem;
    }
    
    .metric-box p { 
      font-family: var(--font-mono);
      font-size: 2.5rem; 
      color: var(--cyan-neon); 
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
    }

    .terminal-window {
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid var(--panel-border);
      padding: 1.5rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      margin-bottom: 2rem;
    }
    .terminal-window .success { color: var(--cyan-neon); }
    
    /* Animación básica */
    .fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#/" class="logo">
        [VECTOR] UniVector PRO
      </a>
      <nav id="nav-links">
        <a href="#/">[INICIO]</a>
        <a href="#/ruta">[RUTA_DE_OPORTUNIDADES]</a>
        <a href="#/radar">[RADAR_DE_ALIADOS]</a>
        <a href="#/laboratorio">[LABORATORIO_DE_EXPERIENCIAS]</a>
        <a href="#/herramientas">[CAJA_DE_HERRAMIENTAS]</a>
      </nav>
    </div>
  </header>

  <!-- Contenedor de Vistas -->
  <main id="app"></main>

  <script>
    const db = {
      oportunidades: [
        { id: 1, tipo: "Beca", tag: "cyan", titulo: "Beca Faro del Norte", desc: "Para estudios de posgrado e investigación internacional." },
        { id: 2, tipo: "Fondo", tag: "magenta", titulo: "Programa Impulso Vectorial", desc: "Fondo de articulación y aceleración para el primer empleo." },
        { id: 3, tipo: "Fondo", tag: "cyan", titulo: "Fondo Gema de Impacto", desc: "Financiación para proyectos de grado con impacto social y tecnológico." },
        { id: 4, tipo: "Beca", tag: "cyan", titulo: "Beca Magnitud Superior", desc: "Para talentos destacados en áreas de innovación y economía." },
        { id: 5, tipo: "Pasantía", tag: "magenta", titulo: "Pasantía Marea Alta", desc: "Programa de prácticas profesionales en gestión estratégica y finanzas." },
        { id: 6, tipo: "Pasantía", tag: "magenta", titulo: "Convocatoria Punto de Aplicación", desc: "Pasantías técnicas e industriales para estudiantes de ingeniería." },
        { id: 7, tipo: "Programa", tag: "cyan", titulo: "Programa Timón Profesional", desc: "Inmersión de liderazgo para jóvenes consultores y analistas." }
      ],
      empresas: [
        { id: 1, sector: "Tecnología e Ingeniería", nombre: "GemaTech Solutions", desc: "Desarrollo de software, IA y analítica." },
        { id: 2, sector: "Tecnología e Ingeniería", nombre: "Vectoria Engineering Corp.", desc: "Infraestructura, energía y automatización." },
        { id: 3, sector: "Tecnología e Ingeniería", nombre: "Rubí Innovaciones Lab", desc: "Materiales, biotecnología e investigación." },
        { id: 4, sector: "Tecnología e Ingeniería", nombre: "Navega Systems", desc: "Logística inteligente y redes descentralizadas." },
        { id: 5, sector: "Economía y Consultoría", nombre: "Zafranal Capital Group", desc: "Banca de inversión y análisis bursátil avanzado." },
        { id: 6, sector: "Economía y Consultoría", nombre: "Esmeralda Global Consulting", desc: "Comercio internacional y estrategia corporativa." },
        { id: 7, sector: "Economía y Consultoría", nombre: "Rumbo Analytics", desc: "Economía aplicada y modelos de Big Data." },
        { id: 8, sector: "Economía y Consultoría", nombre: "Ancla Sostenible S.A.", desc: "Consultoría integral en proyectos de impacto ESG." }
      ],
      talleres: [
        { id: 1, nombre: "Taller Código de Impacto", desc: "Formulación de logros estructurados y metodología STAR." },
        { id: 2, nombre: "La Ruleta de Dilemas", desc: "Intervención en espacio público sobre autonomía vocacional." },
        { id: 3, nombre: "Foro Terreno Laboral", desc: "Conversatorio sobre modalidades de contratación y derechos laborales." },
        { id: 4, nombre: "Simulador de Selección Relámpago", desc: "Prueba de desempeño bajo presión con evaluadores reales." }
      ],
      apps: [
        { id: 1, nombre: "Escape Room: Código de Impacto", desc: "App gamificada del taller de logros y clave de niveles." },
        { id: 2, nombre: "La Caja de Crisis Interactiva", desc: "Aplicativo de tarjetas aleatorias para gestión emocional y resiliencia." },
        { id: 3, nombre: "Brújula Digital de Recursos", desc: "Portal interactivo central de recursos (Esta misma plataforma)." }
      ]
    };

    const generarTarjetasOportunidades = (datos) => {
      if (datos.length === 0) return `<p class="mono-text" style="color: var(--red-alert);">[!] NULL_RESULT: No se encontraron registros.</p>`;
      return datos.map(item => `
        <div class="card">
          <div>
            <span class="badge ${item.tag}">[${item.tipo.toUpperCase()}]</span>
            <h3>${item.titulo}</h3>
            <p>${item.desc}</p>
          </div>
          <button class="btn" onclick="console.log('Ejecutando postulación: ${item.titulo}')">INICIAR_POSTULACIÓN</button>
        </div>
      `).join('');
    };

    const generarTarjetasAliados = (datos) => {
      if (datos.length === 0) return `<p class="mono-text" style="color: var(--red-alert);">[!] NULL_RESULT: Sin coincidencias.</p>`;
      return datos.map(item => `
        <div class="card">
          <div>
            <span class="badge magenta">SEC::${item.sector.substring(0,4).toUpperCase()}</span>
            <h3>${item.nombre}</h3>
            <p>${item.desc}</p>
          </div>
          <button class="btn secondary">ESTABLECER_CONEXIÓN</button>
        </div>
      `).join('');
    };

    const generarTarjetasGenericas = (datos, btnText, btnClass="btn") => {
      return datos.map(item => `
        <div class="card">
          <div>
            <h3>${item.nombre}</h3>
            <p>${item.desc}</p>
          </div>
          <button class="${btnClass}">${btnText}</button>
        </div>
      `).join('');
    };

    const views = {
      
      '/': () => `
        <div class="fade-in">
          <div class="terminal-window">
            <p>> Inicializando Ecosistema Institucional...</p>
            <p>> Cargando módulos de Academia Vectoria...</p>
            <p class="success">> CONEXIÓN ESTABLECIDA. Bienvenido a UniVector PRO.</p>
          </div>
          
          <h1>Panel de Control</h1>
          <p style="margin-bottom: 2rem; max-width: 800px;">Plataforma centralizada para la articulación de talento, financiación académica y aceleración profesional. Entorno seguro.</p>
          
          <div class="metrics-container">
            <div class="metric-box">
              <h4>OPORTUNIDADES_ACTIVAS</h4>
              <p>${db.oportunidades.length}</p>
            </div>
            <div class="metric-box">
              <h4>ENTIDADES_ALIADAS</h4>
              <p>${db.empresas.length}</p>
            </div>
            <div class="metric-box">
              <h4>MÓDULOS_DESPLEGADOS</h4>
              <p>${db.talleres.length + db.apps.length}</p>
            </div>
          </div>

          <h2 style="font-size: 1.2rem; margin-bottom: 1.5rem;">[ RUTA_DE_ACCESO_RÁPIDO ]</h2>
          <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));">
            <div class="card">
              <h3>Ruta de Oportunidades</h3>
              <p>Becas, fondos y pasantías para el desarrollo integral.</p>
              <a href="#/ruta" class="btn">ACCEDER</a>
            </div>
            <div class="card">
              <h3>Radar de Aliados</h3>
              <p>Directorio de corporaciones e instituciones asociadas.</p>
              <a href="#/radar" class="btn secondary">ESCANEAR</a>
            </div>
          </div>
        </div>
      `,

      '/ruta': () => `
        <div class="fade-in">
          <h1>Ruta de Oportunidades</h1>
          <p style="margin-bottom: 2rem;">Búsqueda y filtrado de programas de financiación y primer empleo.</p>
          
          <div class="search-container">
            <input type="text" id="busqueda-ruta" class="search-input" placeholder="INGRESE PARÁMETRO (ej. Beca, Faro, Finanzas...)" onkeyup="filtrarRuta()">
          </div>

          <div class="grid" id="grid-ruta">
            ${generarTarjetasOportunidades(db.oportunidades)}
          </div>
        </div>
      `,

      '/radar': () => `
        <div class="fade-in">
          <h1>Radar de Aliados</h1>
          <p style="margin-bottom: 2rem;">Monitoreo de red empresarial e institucional conectada al ecosistema.</p>
          
          <div class="search-container">
            <input type="text" id="busqueda-radar" class="search-input" placeholder="BUSCAR POR NOMBRE O SECTOR..." onkeyup="filtrarRadar()">
          </div>

          <div class="grid" id="grid-radar">
            ${generarTarjetasAliados(db.empresas)}
          </div>
        </div>
      `,

      '/laboratorio': () => `
        <div class="fade-in">
          <h1>Laboratorio de Experiencias</h1>
          <p style="margin-bottom: 2rem;">Registro de talleres de impacto, simulaciones y foros ejecutados.</p>
          
          <div class="grid">
            ${generarTarjetasGenericas(db.talleres, 'VER_REGISTRO', 'btn secondary')}
          </div>
        </div>
      `,

      '/herramientas': () => `
        <div class="fade-in">
          <h1>Caja de Herramientas</h1>
          <p style="margin-bottom: 2rem;">Aplicaciones interactivas desarrolladas en el Campus Navegantes.</p>
          
          <div class="grid">
            ${generarTarjetasGenericas(db.apps, 'EJECUTAR_APP', 'btn')}
          </div>
        </div>
      `
    };

    window.filtrarRuta = () => {
      const q = document.getElementById('busqueda-ruta').value.toLowerCase();
      const res = db.oportunidades.filter(item => 
        item.titulo.toLowerCase().includes(q) || 
        item.desc.toLowerCase().includes(q) || 
        item.tipo.toLowerCase().includes(q)
      );
      document.getElementById('grid-ruta').innerHTML = generarTarjetasOportunidades(res);
    };

    window.filtrarRadar = () => {
      const q = document.getElementById('busqueda-radar').value.toLowerCase();
      const res = db.empresas.filter(item => 
        item.nombre.toLowerCase().includes(q) || 
        item.sector.toLowerCase().includes(q)
      );
      document.getElementById('grid-radar').innerHTML = generarTarjetasAliados(res);
    };

    const app = document.getElementById('app');
    const navLinks = document.querySelectorAll('#nav-links a');

    function router() {
      const path = location.hash.slice(1) || '/';
      const render = views[path] || views['/'];
      app.innerHTML = render();

      navLinks.forEach(link => {
        if (link.getAttribute('href') === `#${path}`) {
          link.classList.add('active');
        } else {
          link.classList.remove('active');
        }
      });
    }

    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', router);
  </script>
</body>
</html>
