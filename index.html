<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VECTOR: Código de Impacto | Portal UniVector PRO</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0e17;
      --bg-card: rgba(15, 23, 42, 0.85);
      --bg-card-hover: rgba(30, 41, 59, 0.9);
      --cyan-neon: #00f3ff;
      --cyan-glow: rgba(0, 243, 255, 0.25);
      --fuchsia-neon: #d946ef;
      --fuchsia-glow: rgba(217, 70, 239, 0.25);
      --red-alert: #ef4444;
      --green-status: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(0, 243, 255, 0.3);
      --font-mono: 'Fira Code', monospace;
      --font-sans: 'Inter', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        linear-gradient(to right, rgba(0, 243, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 243, 255, 0.04) 1px, transparent 1px);
      background-size: 30px 30px;
    }

    header {
      background-color: rgba(10, 14, 23, 0.95);
      border-bottom: 1px solid var(--cyan-neon);
      box-shadow: 0 0 15px var(--cyan-glow);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
    }

    .brand-logo {
      font-family: var(--font-mono);
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--cyan-neon);
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px var(--cyan-neon);
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--fuchsia-neon);
      font-family: var(--font-mono);
      border-left: 2px solid var(--fuchsia-neon);
      padding-left: 0.5rem;
    }

    nav {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    nav a {
      color: var(--text-muted);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      padding: 0.5rem 0.8rem;
      border: 1px solid transparent;
      border-radius: 4px;
      transition: all 0.2s ease-in-out;
      text-transform: uppercase;
    }

    nav a:hover, nav a.active {
      color: var(--cyan-neon);
      border-color: var(--cyan-neon);
      background-color: rgba(0, 243, 255, 0.08);
      box-shadow: 0 0 10px var(--cyan-glow);
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .section-header {
      margin-bottom: 2rem;
      border-left: 4px solid var(--cyan-neon);
      padding-left: 1rem;
    }

    .section-header h1 {
      font-family: var(--font-mono);
      font-size: 1.8rem;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .section-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--green-status);
      color: var(--green-status);
      margin-top: 0.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--green-status);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green-status);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .controls-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 280px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--cyan-neon);
      color: var(--cyan-neon);
      font-family: var(--font-mono);
      padding: 0.75rem 1rem;
      border-radius: 4px;
      outline: none;
    }

    .search-input::placeholder {
      color: rgba(0, 243, 255, 0.5);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: var(--cyan-neon);
      box-shadow: 0 0 10px var(--cyan-neon);
    }

    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--cyan-neon);
      transform: translateY(-3px);
      box-shadow: 0 5px 20px rgba(0, 243, 255, 0.15);
    }

    .card-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.6rem;
      border-radius: 2px;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      background: rgba(217, 70, 239, 0.15);
      color: var(--fuchsia-neon);
      border: 1px solid var(--fuchsia-neon);
      width: fit-content;
    }

    .card h3 {
      font-family: var(--font-mono);
      font-size: 1.15rem;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .card-entity {
      color: var(--cyan-neon);
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    .meta-box {
      background: rgba(10, 14, 23, 0.8);
      border: 1px dashed rgba(255, 255, 255, 0.1);
      padding: 0.75rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      margin-bottom: 1.25rem;
      color: #cbd5e1;
    }

    .meta-box div { margin-bottom: 0.3rem; }
    .meta-box strong { color: var(--cyan-neon); }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: transparent;
      color: var(--cyan-neon);
      border: 1px solid var(--cyan-neon);
      padding: 0.65rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn:hover {
      background: var(--cyan-neon);
      color: var(--bg-dark);
      box-shadow: 0 0 15px var(--cyan-neon);
    }

    .btn-fuchsia {
      color: var(--fuchsia-neon);
      border-color: var(--fuchsia-neon);
    }

    .btn-fuchsia:hover {
      background: var(--fuchsia-neon);
      color: var(--bg-dark);
      box-shadow: 0 0 15px var(--fuchsia-neon);
    }

    .btn-group {
      display: flex;
      gap: 0.5rem;
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 14, 23, 0.9);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-content {
      background: var(--bg-dark);
      border: 2px solid var(--cyan-neon);
      border-radius: 8px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      box-shadow: 0 0 30px var(--cyan-glow);
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      background: transparent;
      border: 1px solid var(--red-alert);
      color: var(--red-alert);
      font-family: var(--font-mono);
      font-weight: bold;
      padding: 0.2rem 0.6rem;
      cursor: pointer;
    }

    footer {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(10, 14, 23, 0.95);
      padding: 1.5rem;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 3rem;
    }

    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#/" class="brand">
        <span class="brand-logo">VECTOR</span>
        <span class="brand-sub">Código de Impacto | Campus Navegantes</span>
      </a>
      <nav id="nav-menu">
        <a href="#/">Inicio</a>
        <a href="#/rutaoportunidades">Ruta de Oportunidades</a>
        <a href="#/radaraliados">Radar de Aliados</a>
        <a href="#/laboratorio">Laboratorio</a>
        <a href="#/herramientas">Caja de Herramientas</a>
      </nav>
    </div>
  </header>

  <main id="app"></main>

  <footer>
    UNIVERSIDAD NACIONAL DE COLOMBIA - UniVector PRO | Plataforma Desarrollada por el Equipo VECTOR
  </footer>

  <div id="modal-root"></div>

  <script>
    const RAW_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSuTRM20RXbd8svLWFUhqbzDFJ-k1qJlzkPEJPyTl4QFQ4XbOK8KT3ZFw5Fndzfc5GhfTsNP62IkBpl/pub?output=csv";

    const state = {
      liveConvocatorias: [],
      isLoading: true,
      loadError: false,
      searchTerm: ''
    };

    function parseCSV(text) {
      const lines = [];
      let row = [];
      let col = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i + 1];

        if (c === '"') {
          if (inQuotes && next === '"') { col += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (c === ',' && !inQuotes) {
          row.push(col.trim());
          col = '';
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') { i++; }
          row.push(col.trim());
          if (row.some(field => field !== '')) lines.push(row);
          row = [];
          col = '';
        } else {
          col += c;
        }
      }
      if (col || row.length) {
        row.push(col.trim());
        if (row.some(field => field !== '')) lines.push(row);
      }

      if (lines.length < 2) return [];

      const headers = lines[0];
      return lines.slice(1).map(r => {
        const obj = {};
        headers.forEach((h, idx) => {
          obj[h.trim()] = r[idx] ? r[idx].trim() : '';
        });
        return obj;
      });
    }

    async function fetchLiveData() {
      state.isLoading = true;
      state.loadError = false;
      
      const targetUrl = RAW_SHEET_URL + "&t=" + new Date().getTime();
      const endpoints = [
        targetUrl,
        "https://api.allorigins.win/raw?url=" + encodeURIComponent(targetUrl),
        "https://corsproxy.io/?" + encodeURIComponent(targetUrl)
      ];

      let csvText = null;

      for (const url of endpoints) {
        try {
          const response = await fetch(url);
          if (response.ok) {
            const text = await response.text();
            if (text && text.length > 20 && !text.includes("<!DOCTYPE html>")) {
              csvText = text;
              break;
            }
          }
        } catch (err) {
          console.warn("Reintentando conexión con endpoint alternativo:", url);
        }
      }

      if (csvText) {
        state.liveConvocatorias = parseCSV(csvText);
        state.loadError = false;
      } else {
        state.loadError = true;
      }

      state.isLoading = false;
      router();
    }

    const views = {
      '/': () => `
        <div class="section-header fade-in">
          <h1>SISTEMA OPERATIVO | VECTOR: CÓDIGO DE IMPACTO</h1>
          <p>Ecosistema Institucional de Empleabilidad y Autonomía Vocacional - UniVector PRO</p>
          <div class="status-badge">
            <span class="status-dot"></span> 
            ${state.isLoading ? 'CONECTANDO CON BASE DE DATOS...' : 'BASE DE DATOS EN VIVO CONECTADA (' + state.liveConvocatorias.length + ' REGISTROS)'}
          </div>
        </div>

        <div class="grid fade-in">
          <div class="card">
            <span class="card-tag">Módulo Principal</span>
            <h3>Ruta de Oportunidades</h3>
            <p>Accede directamente a las convocatorias de prácticas y pasantías registradas en tiempo real en la base de datos de la Universidad.</p>
            <a href="#/rutaoportunidades" class="btn">Explorar Convocatorias (${state.liveConvocatorias.length})</a>
          </div>

          <div class="card">
            <span class="card-tag">Red Estratégica</span>
            <h3>Radar de Aliados</h3>
            <p>Catálogo de organizaciones y empresas con convenios directos y preferencia por egresados UniVector.</p>
            <a href="#/radaraliados" class="btn btn-fuchsia">Ver Aliados</a>
          </div>

          <div class="card">
            <span class="card-tag">Formación Práctica</span>
            <h3>Laboratorio de Experiencias</h3>
            <p>Talleres de formulación de logros (Método STAR), simulación de selección y gestión vocacional.</p>
            <a href="#/laboratorio" class="btn">Ver Talleres</a>
          </div>

          <div class="card">
            <span class="card-tag">Software y Apps</span>
            <h3>Caja de Herramientas</h3>
            <p>Aplicaciones interactivas creadas para dinamizar la autogestión de carrera y resolución de crisis.</p>
            <a href="#/herramientas" class="btn btn-fuchsia">Abrir Apps</a>
          </div>
        </div>
      `,

      '/rutaoportunidades': () => {
        const filtered = state.liveConvocatorias.filter(item => {
          const q = state.searchTerm.toLowerCase();
          return (
            (item['Título de la convocatoria'] || '').toLowerCase().includes(q) ||
            (item['Nombre de la entidad'] || '').toLowerCase().includes(q) ||
            (item['Programas académicos requeridos'] || '').toLowerCase().includes(q) ||
            (item['Ciudad'] || '').toLowerCase().includes(q)
          );
        });

        return `
          <div class="section-header fade-in">
            <h1>Ruta de Oportunidades (Prácticas y Pasantías)</h1>
            <p>Convocatorias oficiales sincronizadas en tiempo real desde el Google Sheet oficial.</p>
            <div class="status-badge">
              <span class="status-dot"></span> 
              ${state.isLoading ? 'CARGANDO REGISTROS EN VIVO...' : 'SINCRONIZADO EN TIEMPO REAL (' + state.liveConvocatorias.length + ' OFERTAS)'}
            </div>
          </div>

          <div class="controls-bar fade-in">
            <input 
              type="text" 
              class="search-input" 
              placeholder="Ingresa parámetro de búsqueda (carrera, empresa, ciudad, palabra clave)..."
              value="${state.searchTerm}"
              oninput="state.searchTerm = this.value; router();"
            />
          </div>

          ${state.isLoading ? '<p style="color:var(--cyan-neon); font-family:var(--font-mono);">Cargando datos desde Google Sheets...</p>' : ''}
          ${state.loadError ? '<p style="color:var(--red-alert); font-family:var(--font-mono);">Error al descargar los datos. Comprueba la publicación del archivo en la web.</p>' : ''}

          <div class="grid fade-in">
            ${filtered.length === 0 && !state.isLoading ? '<p style="color:var(--text-muted);">No se encontraron convocatorias que coincidan con el parámetro de búsqueda.</p>' : ''}
            
            ${filtered.map((c, idx) => `
              <div class="card">
                <div>
                  <span class="card-tag">${c['Modalidad'] || 'Convocatoria'}</span>
                  <h3>${c['Título de la convocatoria'] || c['Cargo'] || 'Sin Título'}</h3>
                  <div class="card-entity">Entidad: ${c['Nombre de la entidad'] || 'No registrada'}</div>
                  <p>${(c['Descripción'] || 'Sin descripción disponible.').substring(0, 110)}...</p>
                </div>
                
                <div>
                  <div class="meta-box">
                    <div><strong>Programa:</strong> ${c['Programas académicos requeridos'] || 'Todos'}</div>
                    <div><strong>Apoyo:</strong> ${c['Apoyo económico'] || 'No especificado'}</div>
                    <div><strong>Ciudad:</strong> ${c['Ciudad'] || 'No especificada'}</div>
                    <div><strong>Cierre:</strong> ${c['Fecha de cierre'] || 'Abierta'}</div>
                  </div>

                  <div class="btn-group">
                    <button class="btn" onclick="openModal(${idx})">Ver Detalle Completo</button>
                    ${c['Si desea ser presentado por la Universidad, postule su hoja de vida en el siguiente forms'] ? 
                      `<a href="${c['Si desea ser presentado por la Universidad, postule su hoja de vida en el siguiente forms']}" target="_blank" class="btn btn-fuchsia">Postular</a>` : ''
                    }
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        `;
      },

      '/radaraliados': () => `
        <div class="section-header fade-in">
          <h1>Radar de Aliados (Empresas Preferenciales)</h1>
          <p>Organizaciones vinculadas al programa de captación de talento UniVector PRO.</p>
        </div>
        <div class="grid fade-in">
          <div class="card">
            <span class="card-tag">Tecnología e IA</span>
            <h3>GemaTech Solutions</h3>
            <div class="card-entity">Sector: Desarrollo y Analítica</div>
            <p>Empresa líder en soluciones algorítmicas de alto impacto. Busca activamente perfiles de analítica de datos e ingeniería.</p>
            <a href="mailto:talento@gematech.vector" class="btn">Contactar Reclutador</a>
          </div>
          <div class="card">
            <span class="card-tag">Finanzas y Bolsa</span>
            <h3>Zafranal Capital Group</h3>
            <div class="card-entity">Sector: Banca de Inversión</div>
            <p>Firma orientada a mercados emergentes y análisis financiero con enfoque de inversión sostenible (ESG).</p>
            <a href="mailto:carreras@zafranal.vector" class="btn btn-fuchsia">Contactar Reclutador</a>
          </div>
          <div class="card">
            <span class="card-tag">Consultoría Ambiental</span>
            <h3>Ancla Sostenible S.A.</h3>
            <div class="card-entity">Sector: Impacto Territorial</div>
            <p>Proyectos de intervención socio-ambiental, mitigación de riesgo y sostenibilidad corporativa.</p>
            <a href="mailto:impacto@anclasostenible.org" class="btn">Contactar Reclutador</a>
          </div>
        </div>
      `,

      '/laboratorio': () => `
        <div class="section-header fade-in">
          <h1>Laboratorio de Experiencias</h1>
          <p>Talleres formativos e intervenciones estratégicas realizadas por el equipo VECTOR.</p>
        </div>
        <div class="grid fade-in">
          <div class="card">
            <span class="card-tag">Metodología STAR</span>
            <h3>Taller Código de Impacto</h3>
            <p>Formulación estratégica de logros de hoja de vida, estructuración de impactos y preparación técnica de entrevistas.</p>
          </div>
          <div class="card">
            <span class="card-tag">Autonomía Vocacional</span>
            <h3>La Ruleta de Dilemas</h3>
            <p>Intervención dinámica en espacio público para el análisis de toma de decisiones y proyección profesional.</p>
          </div>
          <div class="card">
            <span class="card-tag">Simulación Real</span>
            <h3>Simulador de Selección Relámpago</h3>
            <p>Sesiones relámpago con evaluadores reales para retroalimentación en tiempo real del perfil del aspirante.</p>
          </div>
        </div>
      `,

      '/herramientas': () => `
        <div class="section-header fade-in">
          <h1>Caja de Herramientas (Apps)</h1>
          <p>Software y aplicativos diseñados para acompañar la gestión emocional y técnica.</p>
        </div>
        <div class="grid fade-in">
          <div class="card">
            <span class="card-tag">Gamificación</span>
            <h3>Escape Room: Código de Impacto</h3>
            <p>Aplicación interactiva de resolución de retos para la identificación de logros laborales clave.</p>
            <button onclick="alert('Iniciando simulador Escape Room...');" class="btn">Lanzar App</button>
          </div>
          <div class="card">
            <span class="card-tag">Gestión Emocional</span>
            <h3>La Caja de Crisis Interactiva</h3>
            <p>Módulo interactivo de tarjetas aleatorias para contención y autorregulación en momentos de toma de decisiones.</p>
            <button onclick="alert('Abriendo Caja de Crisis...');" class="btn btn-fuchsia">Lanzar App</button>
          </div>
        </div>
      `
    };

    function openModal(index) {
      const item = state.liveConvocatorias[index];
      if (!item) return;

      const modalHtml = `
        <div class="modal-overlay fade-in" onclick="closeModal(event)">
          <div class="modal-content" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">X</button>
            <h2 style="color:var(--cyan-neon); font-family:var(--font-mono); margin-bottom:1rem;">
              ${item['Título de la convocatoria'] || item['Cargo'] || 'Detalle de Convocatoria'}
            </h2>
            
            <div style="font-family:var(--font-mono); font-size:0.85rem; line-height:1.6; color:#e2e8f0;">
              <p><strong>N° Convocatoria:</strong> ${item['Numero de convocatoria'] || 'N/A'}</p>
              <p><strong>Entidad:</strong> ${item['Nombre de la entidad'] || 'N/A'} (${item['Sector de la entidad'] || 'General'})</p>
              <p><strong>Cargo:</strong> ${item['Cargo'] || 'N/A'} | <strong>Área:</strong> ${item['Área'] || 'N/A'}</p>
              <p><strong>Contacto:</strong> ${item['Correo electrónico'] || 'N/A'}</p>
              <p><strong>Programas Requeridos:</strong> ${item['Programas académicos requeridos'] || 'Todos'}</p>
              <p><strong>Modalidad:</strong> ${item['Modalidad'] || 'N/A'} | <strong>Horario:</strong> ${item['Horario'] || 'N/A'} (${item['Horario flexible'] === 'Sí' ? 'Flexible' : 'Fijo'})</p>
              <p><strong>Apoyo Económico:</strong> ${item['Apoyo económico'] || 'N/A'}</p>
              <p><strong>Tipo de Contrato:</strong> ${item['Tipo de contrato'] || 'N/A'}</p>
              <p><strong>Ubicación:</strong> ${item['Ciudad'] || 'N/A'} | <strong>Vacantes:</strong> ${item['Vacantes'] || 'N/A'}</p>
              <p><strong>Fechas:</strong> Cierre: ${item['Fecha de cierre'] || 'Abierta'} | Inicio: ${item['Fecha de inicio de activities'] || item['Fecha de inicio de actividades'] || 'N/A'}</p>
              
              <hr style="border-color:var(--border-color); margin:1rem 0;">
              
              <p><strong>Descripción del Puesto:</strong></p>
              <p style="color:var(--text-muted); margin-bottom:1rem;">${item['Descripción'] || 'Sin descripción.'}</p>

              <p><strong>Perfil del Aspirante:</strong></p>
              <p style="color:var(--text-muted); margin-bottom:1.5rem;">${item['Perfil del aspirante'] || 'Sin perfil detallado.'}</p>

              ${item['Si desea ser presentado por la Universidad, postule su hoja de vida en el siguiente forms'] ? `
                <a href="${item['Si desea ser presentado por la Universidad, postule su hoja de vida en el siguiente forms']}" target="_blank" class="btn btn-fuchsia">
                  Postular Hoja de Vida (Google Forms)
                </a>
              ` : ''}
            </div>
          </div>
        </div>
      `;
      document.getElementById('modal-root').innerHTML = modalHtml;
    }

    function closeModal() {
      document.getElementById('modal-root').innerHTML = '';
    }

    function router() {
      const path = location.hash.slice(1) || '/';
      const renderView = views[path] || views['/'];
      
      document.getElementById('app').innerHTML = renderView();

      document.querySelectorAll('#nav-menu a').forEach(link => {
        link.classList.toggle('active', link.getAttribute('href') === `#${path}`);
      });
    }

    window.addEventListener('hashchange', router);
    window.addEventListener('DOMContentLoaded', () => {
      fetchLiveData();
    });
  </script>
</body>
</html>
